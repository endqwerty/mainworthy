# Automatic retries are disabled while CI uses one execution runner. The controller waits for each retry
# and would occupy the runner its retry needs. Run scripts/ci-rerun.ts from a separate machine for the
# existing bounded retry behavior (decision 0128), or use GitHub's manual rerun controls.
#
# GitHub runs this from the default branch's copy, whatever branch the check ran on, so what runs here is code that
# was reviewed. It reads the failed run's artifacts and jobs, and can run its jobs again: nothing else.
name: rerun

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  # To download the failed run's artifacts and run its jobs again.
  actions: write

concurrency:
  group: rerun-${{ github.event.workflow_run.id }}

jobs:
  rerun:
    # The controller waits for queued retries and would hold the sole execution runner they need.
    # Manual GitHub reruns and ci-rerun.ts from a separate machine remain available.
    if: ${{ false }}
    runs-on: [self-hosted, Linux, X64, mainworthy-ci]
    # Three jobs, one after the other, each with the gate after it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run the failed jobs again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci-rerun.ts ${{ github.event.workflow_run.id }}
