# When the check fails, the jobs a test failing by chance could have failed run once more, so that Mainworthy can tell
# a flaky test from a broken commit: a test that passes on the retry has flipped, and reads as flaky (decision 0128).
# scripts/ci-rerun.ts chooses the jobs and runs them again one after the other; the run's summary says what it chose.
#
# GitHub runs this from the default branch's copy, whatever branch the check ran on, so what runs here is code that
# was reviewed. It reads the failed run's artifacts and jobs, and can run its jobs again: nothing else.
name: rerun

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  # To download the failed run's artifacts and run its jobs again.
  actions: write

concurrency:
  group: rerun-${{ github.event.workflow_run.id }}

jobs:
  rerun:
    # A run's first attempt only: a run that ran again, by this job or by a person, is left as it is. Only runs of a
    # branch of this repository: a fork's run is not this token's to run again.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Three jobs, one after the other, each with the gate after it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Run the failed jobs again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci-rerun.ts ${{ github.event.workflow_run.id }}
