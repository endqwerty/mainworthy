# Tells Mainworthy when a pull request ends or is opened again (decision 0022). A failure nobody explained on a
# pull request that was merged or closed is then no longer asked about: nobody will act on the answer, and a
# failure that came with the merge fails on `main` and is asked about there.
#
# One request with the pipeline's token, and no checkout: the operation is `change`, the same call as
# `mainworthy change --change pr:482 --state merged`. Nothing runs when the repository names no instance.
#
# Run it by hand for a pull request that ended before this workflow existed, or whose event was missed:
# `gh workflow run change.yml -f pull=150`.
name: change

on:
  pull_request:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      pull:
        description: The pull request's number
        required: true
        type: number
      state:
        description: Optional override (merged, closed, open); defaults to GitHub
        required: false
        type: string

permissions: {}

jobs:
  tell:
    # A pull request from a fork is given no secret, so nothing is said about it.
    if: ${{ vars.MAINWORTHY_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One pull request's reports go one at a time, in order, so a close and a reopen during a deploy land as sent.
    concurrency:
      group: change-${{ inputs.pull || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: read
    steps:
      - name: Say how the pull request ended
        env:
          MAINWORTHY_URL: ${{ vars.MAINWORTHY_URL }}
          MAINWORTHY_PROJECT: ${{ vars.MAINWORTHY_PROJECT }}
          MAINWORTHY_TOKEN: ${{ secrets.MAINWORTHY_TOKEN }}
          PULL: ${{ inputs.pull || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ inputs.state || (github.event_name == 'pull_request' && (github.event.pull_request.merged && 'merged' || github.event.pull_request.state)) || '' }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL" > pull.json
            STATE=${STATE:-$(jq -r 'if .merged then "merged" else .state end' pull.json)}
            HEAD_COMMIT=$(jq -r '.head.sha // ""' pull.json)
            MERGED_COMMIT=$(jq -r 'if .merged then .merge_commit_sha // "" else "" end' pull.json)
            BASE_BRANCH=$(jq -r '.base.ref' pull.json)
          fi
          case "$STATE" in
            merged|closed|open) ;;
            *) echo "::error::State must be merged, closed or open."; exit 1 ;;
          esac
          request() {
            local attempt status code
            # At most 230 seconds per request, including connection timeouts and pauses.
            for attempt in {1..12}; do
              code=0
              status=$(curl --silent --show-error --max-time 10 "$@") || code=$?
              case "$status" in 4??) break ;; esac
              if [ "$code" = 0 ]; then
                case "$status" in 502|503|504) ;; *) break ;; esac
              fi
              if [ "$attempt" = 12 ]; then break; fi
              echo "::warning::The instance is unavailable ($status). Retrying in 10 seconds ($attempt/12)." >&2
              sleep 10
            done
            printf '%s' "$status"
          }
          # Upgrading is live for Docker, but cannot accept this lifecycle write yet. Bound the wait so a
          # stuck upgrade still fails this job. This wall-clock wait is separate from the app's idle watchdog.
          upgrade_deadline=$((SECONDS + 1800))
          while :; do
            health_status=$(request -o health.json -w '%{http_code}' "$MAINWORTHY_URL/health")
            # An upgrading server answers 503 (200 before #941) with this body.
            case "$health_status" in 200|503) ;; *) break ;; esac
            if ! jq -e '.ok == false and .state == "upgrading"' health.json > /dev/null 2>&1; then break; fi
            if [ "$SECONDS" -ge "$upgrade_deadline" ]; then
              echo "::error::The instance did not finish upgrading within 30 minutes. Replay this event after recovery."
              exit 1
            fi
            sleep 10
          done
          if [ "$health_status" != 200 ]; then
            echo "::error::The server answered $health_status to /health. Fix the cause, then replay this event with workflow_dispatch."
            exit 1
          fi
          api_header=()
          if jq -e '.ok == true and .apiVersion == 3' health.json > /dev/null; then
            api_header=(-H 'x-mainworthy-api-version: 3')
          elif jq -e 'type == "object" and .ok == true and (has("apiVersion") | not)' health.json > /dev/null; then
            echo "::warning::The instance predates API versions. Sending the lifecycle request without a version header until it is redeployed."
          else
            echo "::error::The instance does not advertise API 2 or a health reply from before API versions. Upgrade it, then replay this event with workflow_dispatch."
            exit 1
          fi
          # The head is the pull request's own last commit, whose gate is the change's. A rebase or squash merge
          # lands another commit on trunk, which is the landing and has a gate of its own.
          payload=$(jq -nc --arg change "pr:$PULL" --arg state "$STATE" --arg head "$HEAD_COMMIT" --arg commit "$MERGED_COMMIT" --arg branch "$BASE_BRANCH" '
            {change: $change, state: $state} +
            (if $head != "" then {head: $head} else {} end) +
            (if $state == "merged" and $commit != "" and (["main", "master", "trunk"] | index($branch)) != null
             then {landing: {commit: $commit, branch: $branch}} else {} end)')
          status=$(request -o reply.json -w '%{http_code}' -X POST "$MAINWORTHY_URL/api/p/$MAINWORTHY_PROJECT/change" \
            -H "authorization: Bearer $MAINWORTHY_TOKEN" -H 'content-type: application/json' "${api_header[@]}" \
            -d "$payload")
          if [ -f reply.json ]; then cat reply.json; echo; fi
          if [ "$status" = 200 ] && jq -e '.ok == true' reply.json > /dev/null; then
            exit 0
          fi
          # A change with no report needs no lifecycle update. Other 404s must be replayed after fixing the cause.
          if [ "$status" = 404 ] && jq -e --arg message "change pr:$PULL not found" '.ok == false and .error.code == "not_found" and .error.message == $message' reply.json > /dev/null; then
            exit 0
          fi
          echo "::error::Mainworthy answered $status. Fix the cause, then replay this event with workflow_dispatch."
          exit 1
