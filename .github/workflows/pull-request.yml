# A pull request's description and milestone agree with GitHub and the board (scripts/work/pull-request.ts):
# a closing word is only on a line of its own (`Closes #123`), GitHub links the issues the description closes
# and no other, and the milestone is the one of the issue the pull request is for. A pull request that sits in
# the wrong place on the board, or closes an issue nobody meant, has no other check. Not part of the `gate`.
name: pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, milestoned, demilestoned]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  description:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Description, linked issues and milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/work.ts pr-body ${{ github.event.pull_request.number }}
