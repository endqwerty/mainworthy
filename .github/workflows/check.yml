# The check, and Casebook testing itself: the test results of this repository are reported to Casebook with the
# two pipeline lines a user would add (`casebook report`, `casebook gate`), and the result is Casebook's gate.
#
# The tests run in shards, each on its own runner, balanced by scripts/test-timings.json. The tests that measure
# time (scripts/check-plan.ts, QUIET) have a runner to themselves. Every shard uploads its JUnit file; the `gate`
# job reports them all to one Casebook, each under its shard's name, and runs the gate. A shard that left no
# report fails the gate job: a missing report is not a pass (scripts/ci-gate.ts).
#
# Which Casebook: the deployed one, when the repository names it (variables CASEBOOK_URL and CASEBOOK_PROJECT,
# secret CASEBOOK_TOKEN, a pipeline's token) and the job can use it. It keeps the decisions made about earlier
# runs. Otherwise the job starts its own for this run and says so on the run's summary page
# (scripts/ci-instance.ts; docs/deploy.md has the set-up). An instance on a tailnet is reached by joining it for
# the length of the job (variables TS_OAUTH_CLIENT_ID and TS_AUDIENCE: a federated identity, so no Tailscale
# secret is stored here).
#
# `gate` is the job to require on the branch. It fails when the gate does not pass, when a report is missing,
# and when the type-check or the lint failed.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every shard runs to its end: the gate reads all of them.
      fail-fast: false
      matrix:
        # The shard count is CI_SHARDS in scripts/check-plan.ts; the names are the ones the gate job lists.
        include:
          - { name: tests-1, phase: "--only=parallel --shard=1/5" }
          - { name: tests-2, phase: "--only=parallel --shard=2/5" }
          - { name: tests-3, phase: "--only=parallel --shard=3/5" }
          - { name: tests-4, phase: "--only=parallel --shard=4/5" }
          - { name: tests-5, phase: "--only=parallel --shard=5/5" }
          - { name: quiet, phase: "--only=quiet" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Start the browser once
        # A guess at why the first browser test of a job is slow (scripts/warm-browser.ts). Not a test.
        continue-on-error: true
        run: bun scripts/warm-browser.ts
      - name: Tests
        # A failing test does not end the job here: its report is uploaded and the gate decides.
        continue-on-error: true
        run: bun scripts/check.ts test ${{ matrix.phase }} --junit=test-results/${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  gate:
    needs: [static, tests]
    # Also when a shard or the lint failed: Casebook is told what ran, and this job is the one that fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # For the tailnet step: GitHub signs who this job is, and Tailscale admits it on that.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        # A shard with nothing to download is named, and failed, by the next step but one.
        continue-on-error: true
        with:
          pattern: results-*
          path: test-results
          merge-multiple: true
      - name: Join the tailnet the deployed Casebook is on
        if: ${{ vars.CASEBOOK_URL != '' && vars.TS_OAUTH_CLIENT_ID != '' }}
        # A join that fails leaves the instance unreachable, and the next step then starts its own and says so.
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          # What this tag may reach is the tailnet's access rules: this instance's port 443 and nothing else.
          tags: tag:ci
      - name: Report every shard to Casebook, then the gate
        env:
          # Set these in the repository to report to a deployed Casebook. Without them the job starts its own.
          # The token is given to this step and no other: not to the install, not to another job.
          CASEBOOK_URL: ${{ vars.CASEBOOK_URL }}
          CASEBOOK_TOKEN: ${{ secrets.CASEBOOK_TOKEN }}
          CASEBOOK_PROJECT: ${{ vars.CASEBOOK_PROJECT }}
        run: bun scripts/ci-gate.ts test-results tests-1 tests-2 tests-3 tests-4 tests-5 quiet
      - name: The type-check and the lint passed
        if: always()
        run: test "${{ needs.static.result }}" = success
