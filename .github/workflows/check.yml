# The check, and Mainworthy testing itself: the test results of this repository are reported to Mainworthy with the
# two pipeline lines a user would add (`mainworthy report`, `mainworthy gate`), and the result is Mainworthy's gate.
#
# The tests run in shards, each on its own runner, balanced by scripts/test-timings.json. The tests that measure
# time (scripts/check-plan.ts, PERFORMANCE) have a runner to themselves. Budget misses warn in its job summary (ten times a baseline fails);
# workload errors still fail. Every shard uploads its JUnit file; the `gate`
# job reports them all to one Mainworthy, each under its shard's name, and runs the gate. A shard that left no
# report fails the gate job: a missing report is not a pass (scripts/ci-gate.ts).
#
# Which Mainworthy: the deployed one, when the repository names it (variables MAINWORTHY_URL and MAINWORTHY_PROJECT,
# secret MAINWORTHY_TOKEN, a pipeline's token) and the job can use it. It keeps the decisions made about earlier
# runs. Otherwise the job starts its own for this run and says so on the run's summary page
# (scripts/ci-instance.ts; docs/deploy.md has the set-up). An instance on a tailnet is reached by joining it for
# the length of the job (variables TS_OAUTH_CLIENT_ID and TS_AUDIENCE: a federated identity, so no Tailscale
# secret is stored here).
#
# `image` builds the container the way a deployment does and asks it for a page of the documentation: what the
# image carries is decided by the Dockerfile and .dockerignore, which no test runs. Nothing reports to it.
# On main it saves that tested image for `publish`, which pushes it to GHCR only after `gate` succeeds.
#
# `ios` runs the tests of the iPhone app's Swift package on a Mac, against a Mainworthy started from this commit,
# and builds the app (ios/README.md). Nothing reports to it either. What the app reads of a reply is checked
# before that, in the shards (test/ios-contract.test.ts); this job is where the Swift is compiled.
#
# `scope` decides first what the change needs (scripts/ci-scope.ts, decision 0090): each of the other jobs runs when
# a file it reads changed, and the tests run whole unless every changed file is one that only the tests naming it
# read (prose, the iPhone app, another workflow); then one runner runs those tests and the ones that read every file.
# A job the change does not need is skipped, and the gate counts a skip as a pass only when `scope` asked for it.
# The image also runs for every main push, so even a prose-only commit has an image bearing its revision.
#
# `description` checks a pull request's description and milestone (scripts/work/pull-request.ts): a closing word is
# only on a line of its own, GitHub links the issues the description closes and no other, and the milestone is the
# issue's. Added fragments must name this PR; pending is allowed only for drafts. It reads these facts when the check starts,
# so after a fix to the description or milestone, run the job again
# (`gh run rerun <run> --job <id>`). A push to `main` has no pull request and skips it.
#
# `gate` is the job to require on the branch. It fails when the gate does not pass, when a report is missing,
# and when the type-check, the lint, the image, the iPhone app or the description failed.
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.scope.outputs.static }}
      image: ${{ steps.scope.outputs.image }}
      ios: ${{ steps.scope.outputs.ios }}
      matrix: ${{ steps.scope.outputs.matrix }}
      shards: ${{ steps.scope.outputs.shards }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request's merge commit and its parents; a push to main is compared with the commit before it,
          # which can be several commits back.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: What the change needs
        id: scope
        env:
          # A pull request is tested as its merge commit, whose first parent is the base it is merged into. A push
          # is compared with what the branch held before it; a new branch has no such commit, and everything runs.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: bun scripts/ci-scope.ts "--base=$BASE"

  static:
    needs: scope
    if: ${{ needs.scope.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/async-port.ts --check

  image:
    needs: scope
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.scope.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image creation time
        id: created
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: mainworthy:check
          build-args: |
            MAINWORTHY_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The container answers, and carries the documentation with its diagrams and screenshots
        run: |
          docker network create mainworthy-check
          docker run --detach --name postgres --network mainworthy-check \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env 'POSTGRES_INITDB_ARGS=--locale=C --encoding=UTF8' \
            --health-cmd 'pg_isready -U postgres' --health-interval 2s \
            --health-timeout 5s --health-retries 30 postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          for attempt in $(seq 1 60); do
            if docker exec postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec postgres pg_isready -U postgres
          docker run --detach --name mainworthy --network mainworthy-check --publish 7357:7357 \
            --env MAINWORTHY_DATABASE_URL=postgres://postgres@postgres:5432/postgres mainworthy:check
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7357/healthz | jq --exit-status --arg commit "$GITHUB_SHA" '.ok == true and .commit == $commit'; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:7357/docs | grep --quiet "Mainworthy documentation"
          curl --fail --silent --output /dev/null http://127.0.0.1:7357/docs/diagrams/overview.html
          curl --fail --silent --output /dev/null http://127.0.0.1:7357/docs/screenshots/queue-light.png
          curl --fail --silent http://127.0.0.1:7357/docs/skill/mainworthy.tar.gz | tar -tz | grep --quiet "^mainworthy/SKILL.md$"
      - if: failure()
        run: docker logs mainworthy
      - name: Save the tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker save --output /tmp/mainworthy-image.tar mainworthy:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: mainworthy-image
          path: /tmp/mainworthy-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  ios:
    needs: scope
    if: ${{ needs.scope.outputs.ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Native PostgreSQL 18 for the live server fixtures
        run: |
          brew install postgresql@18
          echo "MAINWORTHY_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - name: The package's tests, against a Mainworthy started from this commit
        run: bun scripts/ios.ts test
      - name: With no Mainworthy to reach, live suites skip and the other package tests pass
        run: swift test --package-path ios/Kit --scratch-path "$HOME/.cache/mainworthy-ios/offline"
      - run: brew install xcodegen
      - name: The app builds for a simulator
        run: bun scripts/ios.ts build

  description:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Closing words, linked issues, milestone and fragment references
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/work.ts pr-body ${{ github.event.pull_request.number }}

  tests:
    name: ${{ matrix.name }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every shard runs to its end: the gate reads all of them.
      fail-fast: false
      # The CI_SHARDS shards of scripts/check-plan.ts and the performance tests, or the files the change needs, in one
      # runner for each phase (`matrix` in scripts/ci-scope.ts). The gate job is given the same names.
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MAINWORTHY_TEST_PG: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: PostgreSQL 18 tools for snapshots and isolated cluster checks
        run: |
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-18
          echo 'MAINWORTHY_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
      - name: A changed changelog is canonical
        if: ${{ matrix.name == 'tests' || matrix.name == 'tests-1' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          if ! git diff --quiet "$BASE" HEAD -- CHANGELOG.md; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              bun scripts/changelog.ts --check --complete --base="$BASE"
            else
              bun scripts/changelog.ts --check --base="$BASE"
            fi
          fi
      - name: Install the browser
        # The Chromium playwright-core is built for (`findChromium` in scripts/check-plan.ts), not the runner's Chrome.
        run: bun run browser
      - name: Start the browser once
        # A guess at why the first browser test of a job is slow (scripts/warm-browser.ts). Not a test.
        continue-on-error: true
        run: bun scripts/warm-browser.ts
      - name: Tests
        # A failing test does not end the job here: its report is uploaded and the gate decides.
        continue-on-error: true
        env:
          # Empty for a shard; the test files of the phase that the change needs otherwise, apart by spaces.
          FILES: ${{ matrix.files }}
        run: bun scripts/check.ts test ${{ matrix.phase }} --junit=test-results/${{ matrix.name }}.xml $FILES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          # Named for the attempt, so that a shard that is run again leaves two artifacts the gate can tell apart
          # (newestAttempt in scripts/check-plan.ts).
          name: results-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: test-results/
          # A run that left nothing to upload fails this job: the Tests step may fail without failing it, and the
          # gate's last step reads this job's result. An artifact that holds files and no whole report is the
          # gate script's to refuse (scripts/ci-gate.ts: "no report").
          if-no-files-found: error
          retention-days: 7

  gate:
    needs: [scope, static, tests, image, ios, description]
    # Also when a shard or the lint failed: Mainworthy is told what ran, and this job is the one that fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      # For the tailnet step: GitHub signs who this job is, and Tailscale admits it on that.
      id-token: write
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MAINWORTHY_TEST_PG: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # A shard with nothing to download is named, and failed, by the next step but one.
        continue-on-error: true
        # Each artifact into a directory of its own name. Merged into one directory, two attempts of a shard are
        # two files of one name, and which is read is which was written last (issue #124).
        with:
          pattern: results-*
          path: test-results
      - name: Join the tailnet the deployed Mainworthy is on
        if: ${{ vars.MAINWORTHY_URL != '' && vars.TS_OAUTH_CLIENT_ID != '' }}
        # A join that fails leaves the instance unreachable, and the next step then starts its own and says so.
        continue-on-error: true
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          # What this tag may reach is the tailnet's access rules: this instance's port 443 and nothing else.
          tags: tag:ci
      - name: Report every shard to Mainworthy, then the gate
        # Without a scope there are no shards to read, and the last step fails on it.
        if: ${{ needs.scope.result == 'success' }}
        env:
          # Set these in the repository to report to a deployed Mainworthy. Without them the job starts its own.
          # The token is given to this step and no other: not to the install, not to another job.
          MAINWORTHY_URL: ${{ vars.MAINWORTHY_URL }}
          MAINWORTHY_TOKEN: ${{ secrets.MAINWORTHY_TOKEN }}
          MAINWORTHY_PROJECT: ${{ vars.MAINWORTHY_PROJECT }}
          SHARDS: ${{ needs.scope.outputs.shards }}
          FILES: ${{ needs.scope.outputs.files }}
        run: bun scripts/ci-gate.ts test-results $SHARDS ${FILES:+"--files=$FILES"}
      - name: The scope, the type-check, the lint, the image, the iPhone app, the description and every shard's job passed
        # A shard's job succeeds with failing tests, which the gate judges. It fails when it could not be set up
        # or left nothing to upload, and after a re-run the gate above would then read its older attempt's. A job
        # the scope did not ask for is skipped, and passes only then.
        if: always()
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.static.result }}" = success || test "${{ needs.scope.outputs.static }}:${{ needs.static.result }}" = false:skipped
          test "${{ needs.image.result }}" = success || test "${{ needs.scope.outputs.image }}:${{ needs.image.result }}" = false:skipped
          test "${{ needs.ios.result }}" = success || test "${{ needs.scope.outputs.ios }}:${{ needs.ios.result }}" = false:skipped
          test "${{ needs.description.result }}" = success || test "${{ github.event_name }}:${{ needs.description.result }}" = push:skipped

  publish:
    needs: [gate, image]
    # `description` is always skipped on a push, and GitHub's implicit `success()` would skip this job for it (#856).
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.image.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: mainworthy-image-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mainworthy-image
          path: /tmp
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load --input /tmp/mainworthy-image.tar
          image=ghcr.io/endqwerty/mainworthy
          candidate="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag mainworthy:check "$candidate"
          docker push "$candidate"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid registry digest for the tested image: $digest"
            exit 1
          fi
          if existing=$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/mainworthy-tag-error"); then
            if [ "$existing" != "$digest" ]; then
              echo "::error::Refusing to overwrite $image:$GITHUB_SHA: existing digest $existing differs from tested digest $digest"
              exit 1
            fi
            echo "Commit tag already matches $digest; leaving it unchanged"
          elif grep --fixed-strings --quiet "$image:$GITHUB_SHA: not found" "$RUNNER_TEMP/mainworthy-tag-error"; then
            docker buildx imagetools create --prefer-index=false --tag "$image:$GITHUB_SHA" "$image@$digest"
          else
            echo "::error::Cannot inspect the commit tag; refusing to publish"
            cat "$RUNNER_TEMP/mainworthy-tag-error"
            exit 1
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --prefer-index=false --tag "$image:main" "$image@$digest"
          else
            echo "main has advanced; published the commit tag only"
          fi
          printf 'Published image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
