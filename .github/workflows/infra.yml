name: infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra*.yml']
  workflow_dispatch:

permissions:
  contents: read

# The backend lock also protects state. A dispatch never takes a write lock.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'mainworthy-infrastructure-drift' || 'mainworthy-infrastructure' }}
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    # Secret transport masks values before Actions prints any step environment.
    uses: ./.github/workflows/infra-execute.yml
    secrets:
      GCP_PRODUCTION_PROJECT: ${{ vars.GCP_PRODUCTION_PROJECT }}
      GCP_PREVIEW_PROJECT: ${{ vars.GCP_PREVIEW_PROJECT }}
      GCP_ATTACHMENTS_BUCKET: ${{ vars.GCP_ATTACHMENTS_BUCKET }}
      GCP_TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_INFRA_DEPLOY_ACCOUNT: ${{ vars.GCP_INFRA_DEPLOY_ACCOUNT }}
      GCP_INFRA_PLAN_ACCOUNT: ${{ vars.GCP_INFRA_PLAN_ACCOUNT }}
      GCP_JOB_RUNTIME: ${{ vars.GCP_JOB_RUNTIME }}
