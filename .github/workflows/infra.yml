name: infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

# The backend lock also protects state. A dispatch never takes a write lock.
concurrency:
  group: mainworthy-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_production_project: ${{ vars.GCP_PRODUCTION_PROJECT }}
      TF_VAR_preview_project: ${{ vars.GCP_PREVIEW_PROJECT }}
      TF_VAR_attachments_bucket: ${{ vars.GCP_ATTACHMENTS_BUCKET }}
      TF_VAR_runtime: ${{ vars.GCP_JOB_RUNTIME || 'null' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Check formatting before authentication
        run: terraform fmt -check -recursive
      - name: Check CI failure paths without credentials
        run: bash ci.test.sh
      - name: Sign in with the event's restricted identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ github.event_name == 'push' && vars.GCP_INFRA_DEPLOY_ACCOUNT || vars.GCP_INFRA_PLAN_ACCOUNT }}
          project_id: ${{ vars.GCP_PRODUCTION_PROJECT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Plan and apply on push, or read drift on dispatch
        env:
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
          EVENT_NAME: ${{ github.event_name }}
          # SQL creation can outlast the GitHub OIDC token. The impersonated token covers the 45-minute job.
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash ci.sh "$EVENT_NAME"
