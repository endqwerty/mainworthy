# One service, one volume. `docker compose up -d`, then open http://localhost:7357 and sign in with the owner
# token: set MAINWORTHY_OWNER_TOKEN below, or read the generated one from the first lines of `docker compose logs`.
services:
  mainworthy:
    build:
      context: .
      args:
        # `MAINWORTHY_COMMIT=$(git rev-parse HEAD) docker compose build` makes /healthz name the commit; unset, it says null.
        MAINWORTHY_COMMIT: ${MAINWORTHY_COMMIT:-}
    restart: unless-stopped
    ports:
      - "7357:7357"
    environment:
      # A long random string. Leave unset to have one generated and printed once on first start.
      MAINWORTHY_OWNER_TOKEN: ${MAINWORTHY_OWNER_TOKEN:-}
      MAINWORTHY_OWNER: ${MAINWORTHY_OWNER:-owner}
      # How long a browser stays signed in: unused, and at most. Empty means 14d and 90d.
      MAINWORTHY_SESSION_IDLE: ${MAINWORTHY_SESSION_IDLE:-}
      MAINWORTHY_SESSION_MAX: ${MAINWORTHY_SESSION_MAX:-}
    volumes:
      - mainworthy-data:/data

volumes:
  mainworthy-data:
