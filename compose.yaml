# App and PostgreSQL, each with its own volume. `docker compose up -d`, then open http://localhost:7357 and sign in with the owner
# token: set MAINWORTHY_OWNER_TOKEN below, or read the generated one from the first lines of `docker compose logs`.
services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_USER: mainworthy
      POSTGRES_DB: mainworthy
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      POSTGRES_PASSWORD: ${MAINWORTHY_POSTGRES_PASSWORD:-mainworthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainworthy -d mainworthy"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - mainworthy-postgres:/var/lib/postgresql
  mainworthy:
    build:
      context: .
      args:
        # `MAINWORTHY_COMMIT=$(git rev-parse HEAD) docker compose build` makes /healthz name the commit; unset, it says null.
        MAINWORTHY_COMMIT: ${MAINWORTHY_COMMIT:-}
    restart: unless-stopped
    ports:
      - "7357:7357"
    environment:
      MAINWORTHY_DATABASE_URL: postgres://mainworthy:${MAINWORTHY_POSTGRES_PASSWORD:-mainworthy}@postgres:5432/mainworthy
      # A long random string. Leave unset to have one generated and printed once on first start.
      MAINWORTHY_OWNER_TOKEN: ${MAINWORTHY_OWNER_TOKEN:-}
      MAINWORTHY_OWNER: ${MAINWORTHY_OWNER:-owner}
      # To rename the owner: the name the owner has now, beside the new name above. Unset it after that start.
      MAINWORTHY_OWNER_WAS: ${MAINWORTHY_OWNER_WAS:-}
      # How long a browser stays signed in: unused, and at most. Empty means 14d and 90d.
      MAINWORTHY_SESSION_IDLE: ${MAINWORTHY_SESSION_IDLE:-}
      MAINWORTHY_SESSION_MAX: ${MAINWORTHY_SESSION_MAX:-}
      # Behind a proxy: the addresses it connects from, and the header it writes the visitor's address in, so
      # that failed sign-ins are counted for each visitor. Both or neither; empty means not set (docs/deploy.md).
      MAINWORTHY_TRUSTED_PROXY: ${MAINWORTHY_TRUSTED_PROXY:-}
      MAINWORTHY_CLIENT_ADDRESS_HEADER: ${MAINWORTHY_CLIENT_ADDRESS_HEADER:-}
      # The iPhone apps the site vouches for, so the phone offers the logins saved for it in the app: team id and
      # bundle identifier, comma-separated. Empty means /.well-known/apple-app-site-association is not found.
      MAINWORTHY_APPLE_APPS: ${MAINWORTHY_APPLE_APPS:-}
      # The address people open the instance at, like https://mainworthy.example. Passkeys belong to its host
      # name and an invitation link starts with it. Empty means no passkeys and a link without a host.
      MAINWORTHY_PUBLIC_URL: ${MAINWORTHY_PUBLIC_URL:-}
      # A marked project the server swaps and fills with the demo again once per known deployed revision (`mainworthy seed`). Only a
      # project that command made is replaced. Empty means none.
      MAINWORTHY_DEMO: ${MAINWORTHY_DEMO:-}
      MAINWORTHY_SMTP_HOST: ${MAINWORTHY_SMTP_HOST:-}
      MAINWORTHY_SMTP_PORT: ${MAINWORTHY_SMTP_PORT:-}
      MAINWORTHY_SMTP_TLS: ${MAINWORTHY_SMTP_TLS:-}
      MAINWORTHY_SMTP_USER: ${MAINWORTHY_SMTP_USER:-}
      MAINWORTHY_SMTP_PASSWORD: ${MAINWORTHY_SMTP_PASSWORD:-}
      MAINWORTHY_MAIL_FROM: ${MAINWORTHY_MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mainworthy-data:/data

volumes:
  mainworthy-postgres:
  mainworthy-data:
