function closeOverlay(){state.palette=null;state.help=false;$('#overlays').innerHTML=''}
function showHelp(){state.palette=null;state.help=true;const section=(heading,rows)=>`<section><h3>${heading}</h3>${rows.map(([label,key])=>`<div class="help-key"><span>${label}</span><span>${key.split(' / ').map(k=>`<kbd>${k}</kbd>`).join(' ')}</span></div>`).join('')}</section>`;$('#overlays').innerHTML=`<div class="overlay-backdrop" data-dismiss="true"><div class="help" aria-label="Keyboard guide"><div style="display:flex;justify-content:space-between"><h2>Keep your hands on the thought.</h2><button data-action="close-overlay"><kbd>Esc</kbd></button></div><p>Keys work when you are not typing. The editor keeps ordinary text ordinary.</p><div class="help-grid">${section('Move around',[['Suite · Queue · Run','g s / g q / g r'],['Find cases','/'],['Every object and action','Ctrl K / ⌘ K'],['Create a case','c'],['Show this guide','?']])}${section('Write a case',[['Title → first step','Enter'],['Start the next step','Enter'],['Expected result','Tab / space > space'],['Tag anywhere','#checkout'],['Make a version now','Ctrl Enter / ⌘ Enter'],['Leave typing, keep the case open','Esc']])}${section('Answer the queue',[['Move down · up','j / k'],['Peek evidence','Space'],['Defect · flaky · infrastructure · expected','d / f / i / e'],['Accept · reject an agent change or finding','a / r'],['Link · track an unlinked test','l / t'],['Undo an answer','u']])}${section('Record a run',[['Pass','p'],['Fail and focus the note','f'],['Record a failure note','Enter'],['Blocked','b'],['Skip','s'],['Cancel a note','Esc']])}</div><p style="margin-top:22px;border-top:1px solid var(--line);padding-top:15px">Private drafts make a version when you leave, after 30 seconds idle, or with Ctrl/Cmd+Enter. There is no save button.</p></div></div>`}
function isDark(){return document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function updateThemeIcon(){const btn=$('#theme-toggle');btn.innerHTML=icon(isDark()?'sun':'moon');btn.setAttribute('aria-label',isDark()?'Switch to light theme':'Switch to dark theme');btn.title=btn.getAttribute('aria-label')}
function toggleTheme(){document.documentElement.dataset.theme=isDark()?'light':'dark';updateThemeIcon()}
function copyMarkdown(){const text=markdownFor(currentCase());if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Markdown copied')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();document.execCommand('copy');el.remove();toast('Markdown copied')}
function performAction(name){if(name==='close-overlay'){closeOverlay();return}if(name==='submit-fail'){reportResult('fail',$('#run-note')?.value||'');return}if(name==='ledger'&&state.view==='queue'&&state.ledger){state.ledger=false;renderQueue();return}if(name==='diff'&&state.view==='case'){state.diff=!state.diff;if(state.diff){state.diffFrom=Math.max(1,currentCase().current-1);state.diffTo=currentCase().current}renderHistory();return}if(name==='history'&&state.view==='case'){state.diff=!state.diff;if(state.diff){state.diffFrom=Math.max(1,currentCase().current-1);state.diffTo=currentCase().current}renderHistory();return}if(name==='palette'){openPalette();return}const action=actionRegistry().find(a=>a.id===name);action?.run()}
document.addEventListener('click',event=>{const el=event.target.closest('button,[data-dismiss]');if(!el)return;if(el.dataset.dismiss&&event.target===el){closeOverlay();return}if(el.dataset.action){performAction(el.dataset.action);return}if(el.dataset.case){openCase(Number(el.dataset.case));return}if(el.dataset.casePage){openCase(Number(el.dataset.casePage),true);return}if(el.dataset.question){const q=questions.find(q=>q.id===Number(el.dataset.question));state.selectedQuestion=q.id;state.queueFilter='all';state.peek=false;state.ledger=!q.open;if(state.view!=='queue')navigate('queue');else renderQueue();return}if(el.dataset.qfilter){state.queueFilter=el.dataset.qfilter;state.selectedQuestion=openQuestions()[0]?.id;state.ledger=false;state.peek=false;renderQueue();return}if(el.dataset.answer){answerQuestion(el.dataset.answer);return}if(el.dataset.result){reportResult(el.dataset.result);return}if(el.dataset.slot){state.runSlot=Number(el.dataset.slot);state.runPending=null;renderRun();return}if(el.dataset.palette){runPalette(Number(el.dataset.palette))}});
document.addEventListener('input',event=>{const el=event.target,c=currentCase();if(el.id==='palette-query'){state.paletteIndex=0;renderPalette();return}if(el.id==='markdown-editor'){parseMarkdown(el.value,c);return}if(el.id==='case-title'){c.draft.title=el.innerText.replaceAll('\n',' ');updateDraft(c);return}if(el.id==='case-context'){c.draft.context=el.innerText;updateDraft(c);return}if(el.dataset.step!==undefined){const index=Number(el.dataset.step),field=el.dataset.field,step=c.draft.steps[index];if(!step)return;step[field]=el.innerText;if(field==='action'&&/(?:\s>\s|=>\s|\sExpected:\s)/i.test(step.action)){const parts=splitStep(step.action);step.action=parts.action;step.expected=parts.expected;c.expecting=index;updateDraft(c);renderSteps();focusStep(index,'expected');return}updateDraft(c)}});
document.addEventListener('paste',event=>{const el=event.target;if(!el.isContentEditable||el.id==='case-context')return;const text=event.clipboardData?.getData('text/plain')||'';if(text.includes('\n')){event.preventDefault();pasteSteps(text,el)}});
document.addEventListener('change',event=>{if(event.target.id==='diff-from')state.diffFrom=Number(event.target.value);else if(event.target.id==='diff-to')state.diffTo=Number(event.target.value);else return;renderHistory()});
document.addEventListener('keydown',event=>{
 state.keyCount++;const key=event.key,lower=key.toLowerCase(),el=event.target,mod=event.metaKey||event.ctrlKey,editing=el.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(el.tagName);
 if(event.repeat&&!editing){event.preventDefault();return}
 if(mod&&lower==='k'){event.preventDefault();if(state.palette)closeOverlay();else openPalette();return}
 if(state.palette){if(key==='Escape'){event.preventDefault();closeOverlay()}else if(key==='ArrowDown'||key==='ArrowUp'){event.preventDefault();state.paletteIndex+=key==='ArrowDown'?1:-1;renderPalette()}else if(key==='Enter'){event.preventDefault();runPalette()}return}
 if(state.help){if(key==='Escape'||key==='?'){event.preventDefault();closeOverlay()}return}
 if(key==='Escape'){event.preventDefault();if(state.runPending){state.runPending=null;renderRun()}else if(editing)el.blur();state.navPrefix=false;return}
 if(mod&&key==='Enter'){event.preventDefault();if(state.runPending)reportResult('fail',$('#run-note').value);else{const made=sealDraft('Explicit key');toast(made?'Version '+currentCase().current+' made':'No unversioned changes')}return}
 if(editing){
  if(el.id==='run-note'&&key==='Enter'&&!event.shiftKey){event.preventDefault();reportResult('fail',el.value);return}
  if(el.id==='case-title'&&key==='Enter'){event.preventDefault();const c=currentCase();if(!c.draft.steps.length)addStep();else focusStep(0);return}
  if(el.dataset.step!==undefined){const index=Number(el.dataset.step);if(key==='Enter'&&!event.shiftKey){event.preventDefault();addStep(index);return}if(key==='Tab'&&!event.shiftKey){event.preventDefault();if(el.dataset.field==='action')startExpected(index);else addStep(index);return}if(key==='Backspace'&&el.innerText===''&&el.dataset.field==='action'&&index>0){event.preventDefault();currentCase().draft.steps.splice(index,1);updateDraft(currentCase());renderSteps();focusStep(index-1);return}}
  return;
 }
 if(mod||event.altKey)return;
 if(state.navPrefix){state.navPrefix=false;clearTimeout(navTimer);if(['s','q','r'].includes(lower)){event.preventDefault();navigate({s:'suite',q:'queue',r:'run'}[lower]);return}return}
 if(lower==='g'){event.preventDefault();state.navPrefix=true;navTimer=setTimeout(()=>state.navPrefix=false,1100);return}
 if(key==='?'){event.preventDefault();showHelp();return}
 if(key==='/'){event.preventDefault();openPalette('search');return}
 if(lower==='c'){event.preventDefault();newCase();return}
 if(state.view==='queue'){if(lower==='j'||lower==='k'){event.preventDefault();moveQuestion(lower==='j'?1:-1);return}if(key===' '){event.preventDefault();state.peek=!state.peek;renderQueue();return}if(lower==='u'){event.preventDefault();undoDecision();return}if(state.ledger)return;const q=currentQuestion(),answer=q&&answerSets[q.kind].find(a=>a[0]===lower);if(answer){event.preventDefault();answerQuestion(answer[2]);return}}
 if(state.view==='run'&&{p:'pass',f:'fail',b:'blocked',s:'skip'}[lower]){event.preventDefault();reportResult({p:'pass',f:'fail',b:'blocked',s:'skip'}[lower]);return}
 if(state.view==='suite'&&['j','k'].includes(lower)){event.preventDefault();const filtered=suiteCases(),index=filtered.findIndex(c=>c.id===state.selectedCase),next=filtered[Math.max(0,Math.min(filtered.length-1,index+(lower==='j'?1:-1)))];if(next){openCase(next.id);const list=$('#case-list');list.scrollTop=Math.max(0,(filtered.indexOf(next)-2)*79);renderCaseRows()}return}
});
window.addEventListener('hashchange',()=>{const [view,id]=location.hash.slice(1).split('/');if(view==='case'&&id){const c=caseById(id);if(c){sealDraft();state.selectedCase=c.id}}if(['suite','queue','run','case'].includes(view)&&view!==state.view)navigate(view)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',updateThemeIcon);
const forcedTheme=new URLSearchParams(location.search).get('theme');if(['light','dark'].includes(forcedTheme))document.documentElement.dataset.theme=forcedTheme;
const [initialView,initialId]=location.hash.slice(1).split('/');if(initialView==='case'&&initialId&&caseById(initialId))state.selectedCase=Number(initialId);if(['suite','queue','run','case'].includes(initialView))state.view=initialView;if(state.view==='run')state.runSlot=nextUnfilled();if(state.view==='queue'&&initialId)state.selectedQuestion=Number(initialId);render();
window.MainworthyMock={cases,folders,questions,run,state,decisionLedger,undoStack,markdownFor,contentOf,checks(){return {cases:cases.length,folders:folders.length,questions:questions.filter(q=>q.open).length,slots:run.slots.length,ciFilled:run.slots.filter(s=>s.result?.producer==='pipeline').length,agentFilled:run.slots.filter(s=>s.result?.producer==='agent').length,renderedRows:$$('.case-row').length,selectedCase:state.selectedCase,selectedQuestion:state.selectedQuestion,runSlot:state.runSlot+1,privateDraft:currentCase()?.dirty,captureTitleFocused:document.activeElement?.id==='case-title',networkRequests:performance.getEntriesByType('resource').filter(r=>/^https?:/.test(r.name)).length}}};
</script>
