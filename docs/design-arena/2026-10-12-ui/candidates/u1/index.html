}

 if(state.ledger){detail.innerHTML='<div class="q-detail-body"><div class="upper">Decision ledger</div><h2>A decision can be undone. Its record stays.</h2><p class="q-desc">Every answer names the question, its evidence and the person who answered. Undo adds a reversal and reopens the question.</p><div class="evidence-box"><div class="upper">Your latest answer</div><p>'+esc(state.decisions[state.decisions.length-1]?.summary||'No decisions yet.')+'</p></div></div><div class="q-detail-footer"><button class="decision-btn" data-act="undo"><kbd>U</kbd> Undo latest answer</button></div>';return}

 if(q.kind==='failure')evidence=`<div class="upper">Observed against ${q.caseId} v${q.version}</div><p>${esc(q.stepAction||'Recorded by Dana during the run')}</p>${q.expected?`<div class="values"><div class="value"><span class="tiny muted">EXPECTED</span><b>${esc(q.expected)}</b></div><div class="value actual"><span class="tiny">OBSERVED</span><b>${esc(q.observed)}</b></div></div>`:''}<div class="tiny muted">Exact basis · same build, same case version</div>${q.note?'<p>'+esc(q.note)+'</p>':''}${state.peek?`<pre class="trace">${q.producer==='human'?'Manual observation by Dana':'AssertionError: '+esc(q.stepAction)}${q.expected?'\n  expected: '+esc(q.expected)+'\n  received: '+esc(q.observed):''}\n  ${q.producer==='human'?'Source: '+run.id+' execution note':'at checkout.spec.js:48 · build #842'}\n  Chromium · staging</pre>`:''}`;
 else if(q.kind==='proposal'||q.kind==='finding')evidence=`<div class="upper">${q.kind==='proposal'?'Proposed by Scout':'Suggested correction'} · not applied</div><p class="tiny">${q.kind==='finding'?'Replace the broad expectation with a check that can fail.':'A reload should not remove an accepted discount.'}</p>${q.kind==='finding'?`<div class="diff-old">− ↳ ${esc(c.versions.find(x=>x.v===q.version)?.steps[1]?.expected||'No expected result')}</div><div class="diff-new">+ ↳ ${esc(q.patch.expected)}</div>`:`<div class="diff-new">+ ${esc(q.patch.action)}<br>↳ ${esc(q.patch.expected)}</div>`}<div class="tiny muted" style="margin-top:12px">Base ${q.caseId} v${q.version} · ${v?.v===q.version?'base still current':'base has changed; acceptance checks it'}</div>${state.peek?'<pre class="trace">Scout · review #27\nClaim: a checkable expected result\nBasis: checkout requirements, revision 8\nThe proposal does not count as a test pass.</pre>':''}`;
 else evidence=`<div class="upper">Unlinked automated test</div><p style="font-family:var(--mono);font-size:11px">${esc(q.title)}</p><div class="tiny muted">${q.testId} · exact test identity, case basis unresolved</div><div style="margin-top:19px;padding-top:16px;border-top:1px solid var(--line)"><div class="upper">Suggested link</div><p>${q.caseId} · ${esc(c.title)}</p><div class="tiny muted">L records this link. T creates a case to track it.</div></div>${state.peek?'<pre class="trace">Path: tests/storefront/checkout.spec.js\nName: '+esc(q.title)+'\nBuild #842 · passed · 2.1s\nNo case version was established.</pre>':''}`;
 const description=q.kind==='failure'?'This failure is new for this build. Classify its cause once; later occurrences keep the answer while its evidence holds.':q.kind==='proposal'?'Scout has proposed a change. Your current case stays untouched until you accept the diff.':q.kind==='finding'?'Scout found a gap in the expectation. Accept the correction or keep the finding in the decision record.':'The pipeline reported a test without a case link. Keep its identity and decide what it belongs to.';
 detail.innerHTML=`<div class="q-detail-body"><div class="between"><span class="id">${q.id}</span><span class="pill ${q.producer==='agent'?'purple':q.kind==='failure'?'red':''}">${q.kind==='failure'?'New failure':q.kind==='unlinked'?'Unlinked':'Human review'}</span></div><h2>${esc(q.title)}</h2><p class="q-desc">${description}</p><dl class="facts"><dt>Producer</dt><dd>${producerHTML(q.producer,true)}</dd><dt>${q.kind==='unlinked'?'Test':'Case'}</dt><dd><button data-open-case="${q.caseId}" style="padding:0;color:var(--accent)">${q.kind==='unlinked'?q.testId:q.caseId+' · v'+q.version} ↗</button></dd><dt>Target</dt><dd>1.4.0-rc3 / staging</dd><dt>Reported</dt><dd>${q.age} ago</dd></dl><div class="between" style="margin-top:25px"><span class="upper">Evidence</span><button data-act="peek" class="tiny muted"><kbd>Space</kbd> ${state.peek?'Hide detail':'Peek detail'}</button></div><div class="evidence-box">${evidence}</div></div><div class="q-detail-footer"><div class="tiny muted">Answer ${q.id}. The next question stays here.</div><div class="decision-buttons">${answerKeys(q).map(k=>`<button class="decision-btn" data-answer="${k}"><kbd>${k.toUpperCase()}</kbd>${answerLabels[k]}</button>`).join('')}</div></div>`;

function ledgerHTML(){return state.decisions.slice().reverse().map(d=>`<div class="ledger-row"><div class="between"><span class="flex"><span class="id">${d.id}</span><span>${esc(d.summary)}</span></span><span class="id">now</span></div><p>◉ Dana · ${d.qid} · ${d.caseId} v${d.version} · ${d.reversal?'supersedes '+d.reversal:'evidence '+d.basis}</p></div>`).join('')||'<div class="empty">Answers will appear here, with their evidence.</div>'}
function scrollQuestionIntoView(){const el=$('.question-row.selected');if(el)el.scrollIntoView({block:'nearest',behavior:'instant'})}
function moveQuestion(delta){state.ledger=false;const qs=visibleQuestions();state.qIndex=Math.max(0,Math.min(qs.length-1,state.qIndex+delta));$$('.question-row').forEach((e,i)=>{e.classList.toggle('selected',i===state.qIndex);e.setAttribute('aria-selected',String(i===state.qIndex))});renderQuestionDetail();scrollQuestionIntoView()}
function answerQuestion(key){
 if(state.ledger)return;const q=activeQuestion();if(!q||!answerKeys(q).includes(key))return;const c=caseMap.get(q.caseId),base=lastVersion(c),before=snapshot(c);
 if((key==='a')&&base.v!==q.version){toast(`${q.id} · the base changed. Review the newer version first.`);return}
 if(key==='a'){
  if(q.kind==='proposal')c.steps.push(copy(q.patch));else if(c.steps[1])c.steps[1].expected=q.patch.expected;
  c.versions.push({...snapshot(c),v:base.v+1,author:'agent',adoptedBy:'Dana',time:'now',reason:'Accepted '+q.id});c.draft=false;c.updated++;
 }
 if(key==='l')q.linkedTo=q.caseId;
 let trackedId=null;
 if(key==='t'){
  const id=`C-${++idCounter}`,content={title:q.title.replace(' › ',' / '),notes:`Tracked from ${q.testId}.`,tags:['checkout'],steps:[{action:q.title,expected:'The reported assertion passes'}]};
  const tracked={id,folder:c.folder,...content,versions:[{...copy(content),v:1,author:'human',time:'now',reason:'Tracked '+q.testId+' via '+q.id}],draft:false,proof:{human:{outcome:'none'},ci:{outcome:'none'},agent:{outcome:'none'}},activity:[],updated:0};cases.push(tracked);caseMap.set(id,tracked);findFolder(c.folder).cases.push(id);q.linkedTo=id;trackedId=id;
 }
 q.status='answered';q.answer=key;const d={id:`D-${state.decisions.length+1}`,qid:q.id,caseId:q.caseId,version:q.version,basis:q.signature,summary:`${answerLabels[key]} · ${q.title}`,answer:key};state.decisions.push(d);state.undo.push({q,before,index:questions.indexOf(q),decision:d,changed:key==='a',trackedId});c.activity.push({producer:'human',text:`${q.id} · ${answerLabels[key]} by Dana${key==='l'?' · linked '+q.testId:''}`});renderQueue();$('#queue-count').textContent=questions.filter(q=>q.status==='open').length;toast(`${q.id} · ${answerLabels[key]} recorded`,true);
}
function undoQuestion(){
 const item=state.undo.pop();if(!item){toast('Nothing to undo');return}const {q,before,decision}=item,c=caseMap.get(q.caseId);q.status='open';delete q.answer;delete q.linkedTo;
 if(item.changed){Object.assign(c,copy(before));c.versions.push({...copy(before),v:lastVersion(c).v+1,author:'human',time:'now',reason:'Undo acceptance of '+q.id});c.updated++}
 if(item.trackedId){const tracked=caseMap.get(item.trackedId);tracked.activity.push({producer:'human',text:'Tracking link undone. The created case remains in the record.'})}
 state.decisions.push({id:`D-${state.decisions.length+1}`,qid:q.id,caseId:q.caseId,version:q.version,basis:q.signature,reversal:decision.id,summary:'Undid '+answerLabels[decision.answer]+' · '+q.id});c.activity.push({producer:'human',text:`Undid ${decision.id}; ${q.id} reopened`});state.ledger=false;state.qFilter='all';state.qIndex=visibleQuestions().findIndex(x=>x.id===q.id);if(state.view!=='queue')nav('queue');else renderQueue();$('#queue-count').textContent=questions.filter(q=>q.status==='open').length;toast(`${q.id} reopened · reversal recorded`);
}
function renderRun(){
 const filled=run.slots.filter(s=>s.result).length,left=40-filled,failures=run.slots.filter(s=>s.result?.outcome==='fail').length;
 $('#main').innerHTML=`<section class="page-head between"><div><div class="upper">${run.id} / Planned run</div><h1>${run.name}</h1><div class="head-meta">${left?left+' slots need you':'All 40 slots have evidence'} <span style="margin:0 7px">·</span> ${failures} failure${failures===1?'':'s'} <span style="margin:0 7px">·</span> versions pinned when this run started</div></div><div class="head-right"><div class="between"><span class="tiny muted">${filled} / 40 recorded</span><span class="pill">${run.env}</span></div><div class="run-progress"><span style="width:${filled/40*100}%"></span></div></div></section><div class="run-layout"><aside class="run-slots"><div class="slots-head"><div class="upper">40 slots · one evidence stream</div><div class="tiny">25 pipeline · 2 agent · ${filled-27} yours</div></div><div class="slot-list" id="slot-list">${run.slots.map((slot,i)=>{const c=caseMap.get(slot.caseId),r=slot.result;return `<div class="slot ${i===state.slot?'selected':''}" data-slot="${i}"><span class="slot-num">${String(i+1).padStart(2,'0')}</span><div style="min-width:0"><div class="slot-label">${esc(c.title)}</div><div class="slot-sub"><span class="id">${c.id}</span>${r?producerHTML(r.producer):'<span>Needs you</span>'}</div></div><span class="slot-outcome outcome-${r?.outcome||'none'}">${r?{pass:'✓',fail:'✗',blocked:'⊘',skip:'−'}[r.outcome]:'·'}</span></div>`}).join('')}</div></aside><section class="run-current" id="run-current"></section><aside class="next-rail" id="next-rail"></aside></div>`;
 renderCurrentSlot();renderNextSlot();const selected=$('.slot.selected');if(selected)selected.scrollIntoView({block:'center',behavior:'instant'});
}
function renderCurrentSlot(){
 const slot=run.slots[state.slot],container=$('#run-current');if(!slot||!container)return;
 if(run.slots.every(s=>s.result)&&!state.inspectSlot){container.innerHTML='<div class="finished"><span style="font-size:35px;color:var(--green)">✓</span><h2>Every slot has evidence.</h2><p>Failures and blocked results still need decisions.</p><button class="btn primary" data-act="queue">Answer the open questions <kbd>G Q</kbd></button></div>';return}
 const c=slot.snapshot,r=slot.result;
 container.innerHTML=`<div class="run-body"><div class="between"><div class="flex"><span class="id">${slot.caseId} / v${slot.version}</span><span class="pill">Slot ${state.slot+1} of 40</span></div><span class="tiny muted">${r?'Recorded evidence':'Your turn · ◉ Dana'}</span></div><h2>${esc(c.title)}</h2><p class="tiny muted">${esc(c.notes)}</p><div class="run-env"><span class="dot" style="background:var(--green)"></span><span>${run.env}</span><span class="id">${run.target}</span><span class="muted">Exact basis · v${slot.version}</span></div><div class="upper">Steps & expected results</div>${c.steps.map((s,i)=>`<div class="run-step"><span class="step-number">${String(i+1).padStart(2,'0')}</span><div><p>${esc(s.action)}</p>${s.expected?`<p class="expect">↳ ${esc(s.expected)}</p>`:''}</div></div>`).join('')}</div><div class="run-actions">${r?`<div class="between"><span class="flex">${producerHTML(r.producer,true)}<span class="pill ${r.outcome==='fail'?'red':'green'}">${r.outcome}</span><span class="tiny muted">${r.basis} · v${slot.version}</span></span><button class="btn" data-act="nextpending">Next unfilled slot →</button></div>${r.note?'<p class="tiny muted" style="margin-top:9px">'+esc(r.note)+'</p>':''}`:`<div class="run-action-buttons"><button class="run-btn pass" data-result="pass"><kbd>P</kbd> Pass</button><button class="run-btn fail" data-result="fail"><kbd>F</kbd> Fail</button><button class="run-btn" data-result="blocked"><kbd>B</kbd> Blocked</button><button class="run-btn" data-result="skip"><kbd>S</kbd> Skip</button></div>${state.pendingFail?'<div class="run-note"><textarea id="failure-note" aria-label="Failure note" placeholder="What happened? Enter records the failure; Escape cancels."></textarea><div class="tiny muted" style="margin-top:6px">The case version and build are attached. <kbd>Enter</kbd> record & continue</div></div>':'<div class="tiny muted" style="margin-top:10px">Record once. Advance to the next unfilled slot.</div>'}`}</div>`;
 if(state.pendingFail){$('#failure-note').focus({preventScroll:true})}
}
function nextPending(after=state.slot){for(let i=after+1;i<run.slots.length;i++)if(!run.slots[i].result)return i;return run.slots.findIndex(s=>!s.result)}
function renderNextSlot(){
 const rail=$('#next-rail');if(!rail)return;const index=nextPending(),next=index>=0?run.slots[index]:null;
 const passes=run.slots.filter(s=>s.result?.outcome==='pass').length,fails=run.slots.filter(s=>s.result?.outcome==='fail').length,blocked=run.slots.filter(s=>s.result?.outcome==='blocked').length;
 rail.innerHTML=`<div class="upper">Up next</div>${next&&index!==state.slot?`<div class="next-card" data-next-case="${next.caseId}"><div class="between"><span class="id">${next.caseId} / v${next.version}</span><span class="tiny muted">${index+1} / 40</span></div><h3>${esc(next.snapshot.title)}</h3>${next.snapshot.steps.slice(0,2).map((s,i)=>`<div class="next-step"><span class="id">${i+1}.</span> ${esc(s.action)}${s.expected?'<div style="color:var(--green);font-size:10px;margin-top:5px">↳ '+esc(s.expected)+'</div>':''}</div>`).join('')}<div class="tiny muted" style="margin-top:7px">Already here. P advances to this case.</div></div>`:'<div class="next-card"><p class="muted tiny">This is the last unfilled slot.</p></div>'}<div class="upper" style="margin-top:29px">Recorded on this target</div><div class="run-tally"><span class="person">✓ Pass</span><strong>${passes}</strong></div><div class="run-tally"><span class="outcome-fail">✗ Fail</span><strong>${fails}</strong></div><div class="run-tally"><span>⊘ Blocked</span><strong>${blocked}</strong></div><div class="run-tally"><span>· Still unfilled</span><strong>${run.slots.filter(s=>!s.result).length}</strong></div><p class="tiny muted" style="margin-top:19px;line-height:1.8">Pipeline and agent evidence fill the same slots. Their recorded results are skipped as you advance.</p>`;
}
function recordResult(outcome){
 const slot=run.slots[state.slot];if(!slot||slot.result)return;
 if(outcome==='fail'&&!state.pendingFail){state.pendingFail=true;renderCurrentSlot();return}
 const note=outcome==='fail'?$('#failure-note')?.value||'':'';
 slot.result={producer:'human',outcome,note,basis:'exact',age:'now'};const c=caseMap.get(slot.caseId);c.proof.human={outcome,age:'now',version:slot.version};c.activity.push({producer:'human',text:`${outcome} · ${run.id} · v${slot.version}${note?' · '+note:''}`});
 if(outcome==='fail'){questions.push({id:`Q-${++qSeq}`,kind:'failure',title:note||'New manual failure',caseId:c.id,producer:'human',age:'now',version:slot.version,signature:'manual/'+qSeq,note,status:'open'});$('#queue-count').textContent=questions.filter(q=>q.status==='open').length}
 state.pendingFail=false;state.inspectSlot=false;const next=nextPending();if(next>=0)state.slot=next;renderRun();toast(`${slot.caseId} · ${outcome} recorded`);
}

 {id:'allcases',label:'Show all cases',key:'',run:()=>{state.tagFilter=false;state.filter='';if(state.view!=='suite')nav('suite');else renderSuite()}},{id:'checkout',label:'Filter cases tagged checkout',key:'',run:()=>{state.tagFilter=!state.tagFilter;state.filter='';state.scroll=0;if(state.view!=='suite')nav('suite');else renderSuite()}},

function paletteObjects(query){
 const q=query.toLowerCase().trim(),out=[];const add=(id,label,type,run,key='')=>{if(!q||(id+' '+label+' '+type).toLowerCase().includes(q))out.push({id,label,type,run,key})};
 commands.forEach(c=>add('Action',c.label,'Command',c.run,c.key));
 add(run.id,run.name,'Run',()=>nav('run'),'G R');
 folders.forEach(f=>add(f.id,f.name,'Folder',()=>{const id=f.cases[0]||findFolder(f.children[0])?.cases[0];if(id)openCase(id)}));
 questions.forEach(q=>{add(q.id,q.title,q.kind,()=>openQuestion(q.id));if(q.testId)add(q.testId,q.title,'Automated test',()=>openQuestion(q.id))});
 cases.forEach(c=>add(c.id,c.title+' '+c.tags.map(t=>'#'+t).join(' '),'Case',()=>openCase(c.id)));
 const rank=item=>item.id.toLowerCase()===q?0:item.id.toLowerCase().startsWith(q)?1:item.label.toLowerCase().startsWith(q)?2:3;
 state.paletteItems=out.sort((a,b)=>rank(a)-rank(b)).slice(0,150);return state.paletteItems;

function openPalette(query=''){
 state.palette={query};state.paletteIndex=0;state.gPrefix=false;
 $('#overlays').innerHTML=`<div class="overlay" id="palette-overlay"><section class="palette" role="dialog" aria-label="Command palette"><div class="palette-input">${icons.search}<input id="palette-query" placeholder="A case, a question, an action…" aria-label="Search objects and actions" autocomplete="off" value="${esc(query)}"><kbd>Esc</kbd></div><div class="palette-list" id="palette-list"></div><div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span style="margin-left:auto">${cases.length.toLocaleString()} cases · every action</span></div></section></div>`;
 $('#palette-query').addEventListener('input',e=>{state.palette.query=e.target.value;state.paletteIndex=0;paintPalette()});paintPalette();$('#palette-query').focus();
}
function paintPalette(){
 const items=paletteObjects(state.palette.query);state.paletteIndex=Math.max(0,Math.min(items.length-1,state.paletteIndex));
 $('#palette-list').innerHTML=items.map((item,i)=>`<div class="palette-entry ${i===state.paletteIndex?'active':''}" data-palette-index="${i}"><span class="id">${esc(item.id)}</span><span class="entry-label">${esc(item.label)}</span>${item.key?`<kbd>${esc(item.key)}</kbd>`:`<span class="pill">${esc(item.type)}</span>`}</div>`).join('')||'<div class="empty">No match. Try a title or short ID.</div>';
 $('.palette-entry.active')?.scrollIntoView({block:'nearest'});
}
function choosePalette(index=state.paletteIndex){const item=state.paletteItems[index];closeOverlay();if(item)item.run()}
function closeOverlay(){state.palette=null;$('#overlays').innerHTML='';if(document.activeElement?.tagName==='INPUT')document.activeElement.blur()}
function showHelp(){
 state.palette=null;
 const groups=[['Move around',[['G S','Suite'],['G Q','Questions'],['G R','Run cockpit'],['/','Search every object'],['⌘ K','Command palette'],['?','This key reference']]],['Write in the outline',[['C','New case, title focused'],['Enter','Title → step → next step'],['Tab','Add expected result'],[' > ','Start expected result'],['⌘ Enter','Make a version'],['Esc','Leave the text field']]],['Answer questions',[['J / K','Next / previous question'],['Space','Peek at evidence'],['D / F / I / E','Defect / flaky / infra / expected'],['A / R','Accept / reject an agent change'],['L / T','Link / track an unlinked test'],['U','Undo the latest answer']]],['Record a run',[['P','Pass, then advance'],['F','Fail, focus the note'],['Enter','Record the failure note'],['B','Blocked, then advance'],['S','Skip, then advance'],['Esc','Cancel a failure note']]]];
 $('#overlays').innerHTML=`<div class="overlay" id="help-overlay"><section class="palette help" role="dialog" aria-label="Keyboard shortcuts"><div class="between"><h2>Keep your hands on the keyboard.</h2><button class="icon-btn" data-close aria-label="Close keyboard shortcuts">✕</button></div><p class="tiny muted">⌘ means Command on Mac, Control elsewhere. Keys outside text fields are single presses.</p><div class="help-grid">${groups.map(([title,rows])=>`<section class="help-group"><h3>${title}</h3>${rows.map(([keys,label])=>`<div class="help-row"><span>${label}</span><span class="keys"><kbd>${esc(keys)}</kbd></span></div>`).join('')}</section>`).join('')}</div><p class="help-foot">Paste plain lines to make steps. <span class="mono">=&gt;</span>, <span class="mono"> &gt; </span> and <span class="mono">Expected:</span> become expected results. Inline <span class="mono">#tags</span> belong in the title.</p></section></div>`;
}
function openQuestion(id){
 state.qFilter='all';state.ledger=false;const q=questions.find(q=>q.id===id);if(q?.status!=='open'){nav('queue');state.ledger=true;renderQueue();return}state.qIndex=visibleQuestions().findIndex(q=>q.id===id);nav('queue');
}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){closeOverlay();return}
 if(e.target.classList.contains('overlay')){closeOverlay();return}
 const pal=e.target.closest('[data-palette-index]');if(pal){choosePalette(Number(pal.dataset.paletteIndex));return}
 const question=e.target.closest('[data-question]');if(question){openQuestion(question.dataset.question);return}
 const opencase=e.target.closest('[data-open-case]');if(opencase){openCase(opencase.dataset.openCase);return}
 const answer=e.target.closest('[data-answer]');if(answer){answerQuestion(answer.dataset.answer);return}
 const result=e.target.closest('[data-result]');if(result){recordResult(result.dataset.result);return}
 const act=e.target.closest('[data-act]');if(act){action(act.dataset.act);return}
 const tab=e.target.closest('[data-rail]');if(tab){state.railTab=tab.dataset.rail;renderRail();return}
 const qfilter=e.target.closest('[data-qfilter]');if(qfilter){state.qFilter=qfilter.dataset.qfilter;state.ledger=false;state.qIndex=0;renderQueue();return}
 const qindex=e.target.closest('[data-qindex]');if(qindex){state.qIndex=Number(qindex.dataset.qindex);moveQuestion(0);return}
 const slot=e.target.closest('[data-slot]');if(slot){state.slot=Number(slot.dataset.slot);state.pendingFail=false;state.inspectSlot=true;renderRun();return}
 const folder=e.target.closest('[data-folder]');if(folder){seal(getCase(),'Left the case');const f=findFolder(folder.dataset.folder),set=f.parent?state.folderOpen:state.rootOpen;if(set.has(f.id))set.delete(f.id);else set.add(f.id);renderSuite();return}
 const expand=e.target.closest('[data-expand]');if(expand){const id=expand.dataset.expand;if(state.expanded===id){seal(getCase(),'Folded the case');state.expanded=null;renderSuite()}else openCase(id);return}
 if(e.target.closest('[data-field]'))return;
 const row=e.target.closest('[data-case]');if(row)openCase(row.dataset.case);
});
function prefixHint(){
 const el=document.createElement('div');el.className='g-hint';el.id='g-hint';el.innerHTML='<span>Go to</span><span><kbd>S</kbd> suite</span><span><kbd>Q</kbd> queue</span><span><kbd>R</kbd> run</span>';document.body.append(el);clearTimeout(gTimer);gTimer=setTimeout(()=>{state.gPrefix=false;$('#g-hint')?.remove()},1500);
}
document.addEventListener('keydown',e=>{
 if(e.isComposing)return;const key=e.key.toLowerCase(),mod=e.metaKey||e.ctrlKey,el=e.target;
 if(mod&&key==='k'){e.preventDefault();openPalette('');return}
 if(state.palette){
  if(key==='escape'){e.preventDefault();closeOverlay();return}
  if(key==='arrowdown'||key==='arrowup'){e.preventDefault();state.paletteIndex+=key==='arrowdown'?1:-1;paintPalette();return}
  if(key==='enter'){e.preventDefault();choosePalette();return}return;
 }
 if($('#help-overlay')){if(key==='escape'||key==='?'){e.preventDefault();closeOverlay()}return}
 if(el.id==='failure-note'){
  if(key==='enter'&&!e.shiftKey){e.preventDefault();recordResult('fail');return}
  if(key==='escape'){e.preventDefault();state.pendingFail=false;renderCurrentSlot();return}return;
 }
 if(el.dataset.field){
  const c=caseMap.get(el.dataset.caseId),i=Number(el.dataset.step||0);
  if(mod&&key==='enter'){e.preventDefault();const field=el.dataset.field,step=el.dataset.step===undefined?undefined:i;seal(c,'Explicit version');repaintCase(c,field,step);toast(`${c.id} · version ${lastVersion(c)?.v||0} is current`);return}
  if(key==='escape'){e.preventDefault();el.blur();return}
  if(key==='enter'){e.preventDefault();if(el.dataset.field==='title')nextStep(c);else if(el.dataset.field==='notes')nextStep(c);else nextStep(c,i);return}
  if(key==='tab'&&!e.shiftKey&&el.dataset.field==='action'){e.preventDefault();c.steps[i].showExpected=true;repaintCase(c,'expected',i);return}
  if(key==='tab'&&e.shiftKey&&el.dataset.field==='expected'){e.preventDefault();focusField(c.id,'action',i);return}return;
 }
 if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'){
  if(key==='escape'){e.preventDefault();el.blur()}if(key==='enter'&&el.id==='outline-filter'){e.preventDefault();const row=outlineRows.find(r=>r.type==='case');if(row)openCase(row.item.id)}return;
 }
 if(mod||e.altKey)return;
 if(el.tagName==='BUTTON'&&(key==='enter'||key===' ')){e.preventDefault();el.click();return}
 if(el.dataset.folder&&(key==='enter'||key===' ')){e.preventDefault();el.click();return}
 if(state.gPrefix){state.gPrefix=false;clearTimeout(gTimer);$('#g-hint')?.remove();if(['s','q','r'].includes(key)){e.preventDefault();nav(key==='s'?'suite':key==='q'?'queue':'run');return}}
 if(key==='g'){e.preventDefault();state.gPrefix=true;prefixHint();return}
 if(key==='?'){e.preventDefault();showHelp();return}
 if(key==='/'){e.preventDefault();openPalette('');return}
 if(key==='c'){e.preventDefault();createCase();return}
 if(key==='u'){e.preventDefault();undoQuestion();return}
 if(state.view==='queue'){
  if(key==='j'||key==='k'||key==='arrowdown'||key==='arrowup'){e.preventDefault();moveQuestion(key==='j'||key==='arrowdown'?1:-1);return}
  if(key===' '){e.preventDefault();state.peek=!state.peek;renderQuestionDetail();return}
  if(answerLabels[key]){e.preventDefault();answerQuestion(key);return}
 }else if(state.view==='run'){
  if({p:'pass',f:'fail',b:'blocked',s:'skip'}[key]){e.preventDefault();recordResult({p:'pass',f:'fail',b:'blocked',s:'skip'}[key]);return}
 }else if(state.view==='suite'){
  if(key==='enter'){e.preventDefault();openCase(state.selected);return}
  if(['j','k','arrowdown','arrowup'].includes(key)){
   e.preventDefault();const visible=outlineRows.filter(r=>r.type==='case'),at=visible.findIndex(r=>r.item.id===state.selected),next=visible[Math.max(0,Math.min(visible.length-1,at+(key==='j'||key==='arrowdown'?1:-1)))];
   if(next){seal(getCase(),'Left the case');state.selected=next.item.id;state.expanded=null;state.scroll=Math.max(0,next.y-80);renderSuite()}return;
  }
 }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>$('#theme-toggle').innerHTML=effectiveDark()?icons.sun:icons.moon);
window.addEventListener('resize',()=>{if(state.view==='suite')paintOutline()});
window.addEventListener('hashchange',()=>readHash());
function readHash(){
 const hash=location.hash.toLowerCase();if(hash.startsWith('#queue')){state.view='queue';render()}else if(hash.startsWith('#run')){state.view='run';state.slot=run.slots.findIndex(s=>!s.result);render()}else if(hash.startsWith('#case')){state.view='suite';state.railTab=hash.includes('versions')?'versions':'activity';const id=location.hash.split('/')[1]||'C-311';state.selected=caseMap.has(id)?id:'C-311';state.expanded=state.selected;const f=findFolder(getCase().folder);state.rootOpen.add(f.parent);state.folderOpen.add(f.id);state.filter='';state.tagFilter=false;flatten();const row=outlineRows.find(r=>r.type==='case'&&r.item.id===state.selected);state.scroll=Math.max(0,(row?.y||0)-75);render()}else{state.view='suite';render()}
}
// The in-memory model is exposed for repeatable prototype checks, never persisted.
window.mainworthy={cases,folders,questions,run,state,commands,parseLines,snapshot,seal,nav,openCase,createCase,answerQuestion,recordResult,undoQuestion,get outlineRows(){return outlineRows}};
readHash();
</script>
</body>
</html>
