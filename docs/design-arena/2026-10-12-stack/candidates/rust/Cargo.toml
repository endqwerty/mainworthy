[package]
name = "mainworthy-rust-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "*", features = ["bundled"] }
tokio-postgres = "0.7"
schemars = "1"
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "schemars"] }
sha2 = "0.10"
quick-xml = "0.38"
anyhow = "1"

[profile.release]
strip = true
