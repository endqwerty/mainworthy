# The Coolify deployment: Mainworthy as its own node on the tailnet, https://mainworthy.example.ts.net, through a
# Tailscale sidecar (the pattern in the home lab's services/coolify-tailnet-apps.md). Nothing is published on the
# LAN. For a laptop or a plain server use compose.yaml instead.
#
# Public traffic must arrive through the host's Cloudflare Tunnel and a request-holding proxy on the host, which
# passes it to the ingress at http://127.0.0.1:758. Remove the old Coolify/Traefik domain after that cutover.
# See docs/deploy.md, "A deploy that holds requests".
#
# First deploy only: set TS_AUTHKEY in Coolify to a single-use auth key. The node's identity then persists in the
# tailscale-state volume and the variable can be deleted. Never use the sign-in link the sidecar prints.
services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_USER: mainworthy
      POSTGRES_DB: mainworthy
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mainworthy -d mainworthy"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mainworthy-postgres:/var/lib/postgresql
    # The app names the database by this alias, which only the internal network knows. Coolify also attaches every
    # service to its shared `coolify` network under its service name, where Coolify's own database is `postgres` too.
    networks:
      database:
        aliases: [mainworthy-database]

  mainworthy:
    build: .
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MAINWORTHY_LOCKDOWN: "1"
      MAINWORTHY_TRUSTED_PROXY: ${MAINWORTHY_TRUSTED_PROXY:?Set the application network peer range}
      MAINWORTHY_CLIENT_ADDRESS_HEADER: ${MAINWORTHY_CLIENT_ADDRESS_HEADER:?Set the dedicated client header}
      # Coolify generates and retains base64 of 32 random bytes, outside PostgreSQL.
      MAINWORTHY_JOB_KEY: ${SERVICE_REALBASE64_32_JOBKEY}
      MAINWORTHY_DATABASE_URL: postgres://mainworthy:${SERVICE_PASSWORD_POSTGRES}@mainworthy-database:5432/mainworthy
      # A long random string. Leave unset to have one generated and printed once on first start.
      MAINWORTHY_OWNER_TOKEN: ${MAINWORTHY_OWNER_TOKEN:-}
      MAINWORTHY_OWNER: ${MAINWORTHY_OWNER:-owner}
      # To rename the owner: the name the owner has now, beside the new name above. Unset it after that start.
      MAINWORTHY_OWNER_WAS: ${MAINWORTHY_OWNER_WAS:-}
      # The address people open the instance at. Passkeys belong to its host name and an invitation link starts
      # with it. Empty means no passkeys and a link without a host.
      MAINWORTHY_PUBLIC_URL: ${MAINWORTHY_PUBLIC_URL:-}
      # The iPhone apps the site vouches for, so the phone offers the logins saved for it in the app: team id and
      # bundle identifier, comma-separated. Empty means /.well-known/apple-app-site-association is not found.
      MAINWORTHY_APPLE_APPS: ${MAINWORTHY_APPLE_APPS:-}
      # The marked project the server swaps and fills with the demo again once per known deployed revision, so it shows this build. Only
      # a project `mainworthy seed` made is replaced. Unset means `demo`; set it empty in Coolify for none (hence
      # `-`, not `:-`, which would read an empty value as unset).
      MAINWORTHY_DEMO: ${MAINWORTHY_DEMO-demo}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, database]
    volumes:
      - mainworthy-data:/data

  ingress:
    image: nginx@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    user: "101:101"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        cat > /tmp/nginx.conf <<'NGINX'
        worker_processes 1;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;
        events { worker_connections 256; }
        http {
            access_log off;
            resolver 127.0.0.11 ipv6=off valid=5s;
            upstream mainworthy_backend {
                zone mainworthy_backend 64k;
                server mainworthy:7357 resolve;
            }
            client_body_temp_path /tmp/client_body;
            proxy_temp_path /tmp/proxy;
            fastcgi_temp_path /tmp/fastcgi;
            uwsgi_temp_path /tmp/uwsgi;
            scgi_temp_path /tmp/scgi;
            server {
                listen 8080;
                server_name _;
                if ($$request_method = CONNECT) { return 405; }
                if ($$request ~* "^[^ ]+ [a-z][a-z0-9+.-]*:") { return 400; }
                location / {
                    proxy_pass http://mainworthy_backend;
                    proxy_connect_timeout 3s;
                    proxy_http_version 1.1;
                    proxy_set_header Host $$host;
                    proxy_set_header Connection "";
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header X-Mainworthy-Client $$http_cf_connecting_ip;
                    proxy_buffering off;
                    proxy_request_buffering off;
                    proxy_read_timeout 300s;
                    client_max_body_size 0;
                }
            }
        }
        NGINX
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=101,gid=101
    mem_limit: 64m
    pids_limit: 64
    # Not the tunnel's port: the hold on the host takes 7358 and outlives every deploy of this stack. A port
    # below 1024, so an ordinary process on the host cannot take it while a deploy leaves it free and receive the
    # requests the hold is keeping; only root or a process with CAP_NET_BIND_SERVICE can.
    ports:
      - "127.0.0.1:758:8080"
    # App liveness includes upgrading: start the ingress so health can report that state. Application requests
    # get 503 until ready. Failed upgrades stop the app rather than leaving a healthy upgrading listener.
    depends_on:
      mainworthy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    # No `hostname:` here: the sidecar would then resolve the service name `mainworthy` to itself, not to the app.
    # TS_HOSTNAME names the tailnet node.
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-mainworthy}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    mem_limit: 128m
    restart: unless-stopped
    exclude_from_hc: true

configs:
  tailscale-serve:
    # The tailscale container substitutes ${TS_CERT_DOMAIN} at start; `$$` stops Compose and Coolify from doing it first.
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://mainworthy:7357" } }
          }
        }
      }

networks:
  database:
    internal: true

volumes:
  mainworthy-postgres:
  mainworthy-data:
  tailscale-state:
